<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WSCL Travel Distance Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Load data as JS variable (works with file:// URLs unlike fetch) -->
  <script src="wscl_distance_data.js" onerror="console.log('No JS data file found, will try fetch')"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function WSCLDashboard() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      
      // Filters
      const [seasonFilter, setSeasonFilter] = useState('all');
      const [viewMode, setViewMode] = useState('actual');
      const [metricMode, setMetricMode] = useState('total');
      const [ridersPerVehicle, setRidersPerVehicle] = useState(2);
      
      // Venue view filters
      const [selectedVenue, setSelectedVenue] = useState('');
      const [selectedEventDate, setSelectedEventDate] = useState('');
      
      // Team view filters
      const [selectedTeam, setSelectedTeam] = useState('');

      useEffect(() => {
        // Try fetch first (works when served via HTTP)
        // Falls back to embedded data (works when opened as file://)
        fetch('wscl_distance_data.json', {cache: 'no-store'})
          .then(response => {
            if (!response.ok) throw new Error('fetch failed');
            return response.json();
          })
          .then(jsonData => {
            setData(jsonData);
            setLoading(false);
          })
          .catch(() => {
            if (window.__WSCL_DATA__) {
              setData(window.__WSCL_DATA__);
              setLoading(false);
            } else {
              setError('Data file not found. Make sure wscl_distance_data.json is in the same folder, or serve via a local web server.');
              setLoading(false);
            }
          });
      }, []);

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 flex items-center justify-center">
            <div className="text-center">
              <div className="text-6xl mb-4">🚴</div>
              <div className="text-xl font-semibold text-gray-700">Loading WSCL Data...</div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-lg shadow-lg p-8 max-w-md">
              <div className="text-4xl mb-4">⚠️</div>
              <h2 className="text-xl font-bold text-red-600 mb-2">Data Not Found</h2>
              <p className="text-gray-700 mb-4">{error}</p>
              <p className="text-sm text-gray-600">
                Make sure wscl_distance_data.json is in the same folder as this HTML file.
              </p>
            </div>
          </div>
        );
      }

      const seasons = ['all', ...new Set(data.travel_data.map(r => r.season))].sort().reverse();

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-green-50 p-4 md:p-8">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-1">
                    🚴 WSCL Travel Distance Tracker
                  </h1>
                  <p className="text-gray-600">Washington Student Cycling League</p>
                </div>
                <div className="text-right">
                  <div className="text-sm text-gray-500">Last Updated</div>
                  <div className="text-lg font-semibold text-gray-700">
                    {new Date(data.metadata.generated_at).toLocaleDateString()}
                  </div>
                </div>
              </div>
              <p className="text-sm text-gray-500 mt-3 border-t pt-3">
                WSCL teams log serious miles getting to races across Washington and Idaho. This dashboard tracks every mile driven since 2023 — who's racking up the road trips, which venues keep everyone close (or don't), and what all that windshield time actually costs.
              </p>
            </div>

            {/* Navigation Tabs */}
            <div className="bg-white rounded-lg shadow-lg mb-6">
              {/* Mobile Menu Button */}
              <div className="md:hidden border-b p-4">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="w-full flex items-center justify-between text-left font-semibold text-gray-800"
                >
                  <span className="flex items-center gap-2">
                    {activeTab === 'leaderboard' && '📊 Team Leaderboard'}
                    {activeTab === 'venues' && '📍 Venue Analysis'}
                    {activeTab === 'teams' && '👥 Team Deep Dive'}
                    {activeTab === 'awards' && '🏆 Awards'}
                    {activeTab === 'costs' && '💰 Cost Analysis'}
                    {activeTab === 'methodology' && '📖 Methodology'}
                  </span>
                  <span className="text-xl">{mobileMenuOpen ? '×' : '☰'}</span>
                </button>
              </div>

              {/* Mobile Menu */}
              {mobileMenuOpen && (
                <div className="md:hidden border-b">
                  <button
                    onClick={() => {
                      setActiveTab('leaderboard');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'leaderboard'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    📊 Team Leaderboard
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('venues');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'venues'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    📍 Venue Analysis
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('teams');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'teams'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    👥 Team Deep Dive
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('awards');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'awards'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    🏆 Awards
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('costs');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'costs'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    💰 Cost Analysis
                  </button>
                  <button
                    onClick={() => {
                      setActiveTab('methodology');
                      setMobileMenuOpen(false);
                    }}
                    className={`w-full text-left px-6 py-4 font-semibold transition-colors ${
                      activeTab === 'methodology'
                        ? 'bg-blue-50 text-blue-600'
                        : 'text-gray-600 hover:bg-gray-50'
                    }`}
                  >
                    📖 Methodology
                  </button>
                </div>
              )}

              {/* Desktop Tabs */}
              <div className="hidden md:flex border-b">
                <button
                  onClick={() => setActiveTab('leaderboard')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'leaderboard'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  📊 Team Leaderboard
                </button>
                <button
                  onClick={() => setActiveTab('venues')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'venues'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  📍 Venue Analysis
                </button>
                <button
                  onClick={() => setActiveTab('teams')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'teams'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  👥 Team Deep Dive
                </button>
                <button
                  onClick={() => setActiveTab('awards')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'awards'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  🏆 Awards
                </button>
                <button
                  onClick={() => setActiveTab('costs')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'costs'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  💰 Cost Analysis
                </button>
                <button
                  onClick={() => setActiveTab('methodology')}
                  className={`px-6 py-4 font-semibold transition-colors ${
                    activeTab === 'methodology'
                      ? 'text-blue-600 border-b-2 border-blue-600'
                      : 'text-gray-600 hover:text-gray-800'
                  }`}
                >
                  📖 Methodology
                </button>
              </div>
            </div>

            {/* Tab Content */}
            {activeTab === 'leaderboard' && (
              <LeaderboardView 
                data={data}
                seasonFilter={seasonFilter}
                setSeasonFilter={setSeasonFilter}
                viewMode={viewMode}
                setViewMode={setViewMode}
                metricMode={metricMode}
                setMetricMode={setMetricMode}
                ridersPerVehicle={ridersPerVehicle}
                setRidersPerVehicle={setRidersPerVehicle}
                seasons={seasons}
              />
            )}

            {activeTab === 'venues' && (
              <VenueView
                data={data}
                selectedVenue={selectedVenue}
                setSelectedVenue={setSelectedVenue}
                selectedEventDate={selectedEventDate}
                setSelectedEventDate={setSelectedEventDate}
              />
            )}

            {activeTab === 'teams' && (
              <TeamView
                data={data}
                selectedTeam={selectedTeam}
                setSelectedTeam={setSelectedTeam}
                ridersPerVehicle={ridersPerVehicle}
              />
            )}

            {activeTab === 'awards' && (
              <AwardsView data={data} seasons={seasons} onTeamClick={(team) => { setSelectedTeam(team); setActiveTab('teams'); }} />
            )}

            {activeTab === 'costs' && (
              <CostAnalysisView data={data} seasons={seasons} />
            )}

            {activeTab === 'methodology' && <MethodologyView />}
          </div>
        </div>
      );
    }

    // LEADERBOARD VIEW
    function LeaderboardView({ data, seasonFilter, setSeasonFilter, viewMode, setViewMode, metricMode, setMetricMode, ridersPerVehicle, setRidersPerVehicle, seasons }) {
      const filteredData = data.travel_data.filter(record => {
        if (seasonFilter === 'all') return true;
        return record.season === seasonFilter;
      });

      const filteredIndependent = (data.independent_data || []).filter(record => {
        if (seasonFilter === 'all') return true;
        return record.season === seasonFilter;
      });

      const leaderboard = calculateLeaderboard(filteredData, data, viewMode, metricMode, ridersPerVehicle);

      const totalMiles = leaderboard.reduce((sum, team) => sum + team.miles, 0);
      const totalRaceEntries = filteredData.reduce((sum, r) => sum + r.riders, 0);
      const totalIndependentEntries = filteredIndependent.reduce((sum, r) => sum + r.riders, 0);
      const totalEvents = new Set(filteredData.map(r => r.date)).size;

      return (
        <>
          {/* Filters */}
          <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 className="text-xl font-bold text-gray-800 mb-4">Filters & Settings</h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">Season</label>
                <select
                  value={seasonFilter}
                  onChange={(e) => setSeasonFilter(e.target.value)}
                  className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                >
                  {seasons.map(season => (
                    <option key={season} value={season}>
                      {season === 'all' ? 'All Time (Since 2023)' : season}
                    </option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">
                  View Mode
                  <span className="ml-1 text-xs text-gray-500 font-normal">ⓘ</span>
                </label>
                <select
                  value={viewMode}
                  onChange={(e) => setViewMode(e.target.value)}
                  className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  title="Actual: Based on riders who attended. Theoretical: If each team sent 1 vehicle to every race."
                >
                  <option value="actual">Actual (Based on Attendance)</option>
                  <option value="theoretical">Theoretical (One Vehicle/Team)</option>
                </select>
              </div>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">
                  Metric
                  <span className="ml-1 text-xs text-gray-500 font-normal">ⓘ</span>
                </label>
                <select
                  value={metricMode}
                  onChange={(e) => setMetricMode(e.target.value)}
                  className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  title="Total: Sum of all miles. Per Entry: Round-trip distance per race entry."
                >
                  <option value="total">Total Miles</option>
                  <option value="per_rider">Avg Miles per Race Entry</option>
                </select>
              </div>

              <div>
                <label className="block text-sm font-semibold text-gray-700 mb-2">
                  Riders per Vehicle
                </label>
                <input
                  type="number"
                  min="1"
                  max="10"
                  value={ridersPerVehicle}
                  onChange={(e) => setRidersPerVehicle(Number(e.target.value))}
                  className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  disabled={metricMode === 'per_rider'}
                />
                {metricMode === 'per_rider' && (
                  <div className="text-xs text-gray-500 mt-1">
                    N/A for averages
                  </div>
                )}
              </div>

            

            {/* Metric Explanation */}
            {metricMode === 'per_rider' && viewMode === 'actual' && (
              <div className="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
                <p className="text-sm text-gray-700">
                  <strong>Average Miles & Time per Race Entry:</strong> Each race entry represents one rider's round-trip 
                  distance and travel time to the venue. The "Riders per Vehicle" setting only affects total miles calculations, 
                  not averages, since each rider travels the same distance regardless of carpooling.
                </p>
              </div>
            )}
          </div>
          </div>

          {/* Summary Stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
            <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
              <div className="text-xs md:text-sm text-gray-500 mb-1">Total Miles</div>
              <div className="text-xl md:text-3xl font-bold text-blue-600">
                {totalMiles.toLocaleString(undefined, { maximumFractionDigits: 0 })}
              </div>
              <div className="text-xs text-gray-500 mt-1">Round-trip</div>
            </div>
            
            <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
              <div className="text-xs md:text-sm text-gray-500 mb-1">Rider-Races</div>
              <div className="text-xl md:text-3xl font-bold text-green-600">
                {totalRaceEntries.toLocaleString()}
              </div>
              <div className="text-xs text-gray-500 mt-1">League teams</div>
            </div>
            
            <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
              <div className="text-xs md:text-sm text-gray-500 mb-1">Independent</div>
              <div className="text-xl md:text-3xl font-bold text-orange-600">
                {totalIndependentEntries.toLocaleString()}
              </div>
              <div className="text-xs text-gray-500 mt-1">No travel</div>
            </div>
            
            <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
              <div className="text-xs md:text-sm text-gray-500 mb-1">Events</div>
              <div className="text-xl md:text-3xl font-bold text-purple-600">{totalEvents}</div>
              <div className="text-xs text-gray-500 mt-1">Race dates</div>
            </div>
          </div>

          {/* Leaderboard Table */}
          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1">Who's Logging the Most Miles?</h2>
            <p className="text-sm text-gray-500 mb-4">Teams ranked by total driving distance. Spoiler: geography is not equally distributed.</p>
            
            <div className="overflow-x-auto -mx-4 md:mx-0">
              <table className="w-full min-w-[600px]">
                <thead>
                  <tr className="border-b-2 border-gray-200">
                    <th className="text-left py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base">Rank</th>
                    <th className="text-left py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base">Team</th>
                    <th className="text-right py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base">Miles</th>
                    <th className="text-right py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base">Time</th>
                    <th className="text-right py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base">Races</th>
                    {viewMode === 'actual' && (
                      <th className="text-right py-2 md:py-3 px-2 md:px-4 font-semibold text-gray-700 text-sm md:text-base" title="Total rider appearances across all races">Rider-Races</th>
                    )}
                  </tr>
                </thead>
                <tbody>
                  {leaderboard.map((team, index) => (
                    <tr key={team.name} className="border-b border-gray-100 hover:bg-gray-50">
                      <td className="py-2 md:py-3 px-2 md:px-4">
                        <span className={`font-bold ${index < 3 ? 'text-lg md:text-xl' : 'text-base md:text-lg'}`}>
                          {index === 0 && '🚗'}
                          {index === 1 && '🚙'}
                          {index === 2 && '🛻'}
                          {index >= 3 && `${index + 1}`}
                        </span>
                      </td>
                      <td className="py-2 md:py-3 px-2 md:px-4 font-medium text-gray-800 text-sm md:text-base">{team.name}</td>
                      <td className="py-2 md:py-3 px-2 md:px-4 text-right font-semibold text-blue-600 text-sm md:text-base" style={{fontVariantNumeric: 'tabular-nums'}}>
                        {team.miles.toLocaleString(undefined, { maximumFractionDigits: 0 })} mi
                      </td>
                      <td className="py-2 md:py-3 px-2 md:px-4 text-right text-gray-600 text-sm md:text-base" style={{fontVariantNumeric: 'tabular-nums'}}>
                        {formatTime(team.minutes)}
                      </td>
                      <td className="py-2 md:py-3 px-2 md:px-4 text-right text-gray-600 text-sm md:text-base" style={{fontVariantNumeric: 'tabular-nums'}}>{team.races}</td>
                      {viewMode === 'actual' && (
                        <td className="py-2 md:py-3 px-2 md:px-4 text-right text-gray-600 text-sm md:text-base" style={{fontVariantNumeric: 'tabular-nums'}}>{team.riders}</td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Visual Chart */}
          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-4">Road Trip Rankings — Top 15</h2>
            <div className="space-y-2">
              {leaderboard.slice(0, 15).map((team, index) => {
                const maxMiles = leaderboard[0].miles;
                const percentage = (team.miles / maxMiles) * 100;
                
                return (
                  <div key={team.name} className="flex items-center gap-2 md:gap-3">
                    <div className="w-24 md:w-32 text-xs md:text-sm font-medium text-gray-700 truncate" title={team.name}>
                      {team.name}
                    </div>
                    <div className="flex-1 bg-gray-200 rounded-full h-6 md:h-8 relative">
                      <div 
                        className="bg-blue-500 h-6 md:h-8 rounded-full flex items-center justify-end pr-2 md:pr-3 transition-all duration-500"
                        style={{ width: `${percentage}%` }}
                      >
                        <span className="text-white font-semibold text-xs md:text-sm">
                          {team.miles.toLocaleString(undefined, { maximumFractionDigits: 0 })} mi
                        </span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Heatmap */}
          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-4">Travel Heatmap - All Races</h2>
            <p className="text-sm text-gray-600 mb-4">
              Visualization of all driving routes since 2023. Brighter colors indicate more frequent travel.
            </p>
            <div className="rounded-lg overflow-hidden border border-gray-200">
              <img 
                src="heatmaps/heatmap_overall.png" 
                alt="Overall travel heatmap"
                className="w-full h-auto"
                onError={(e) => {
                  e.target.style.display = 'none';
                  e.target.nextSibling.style.display = 'block';
                }}
              />
              <div style={{ display: 'none' }} className="p-8 text-center text-gray-500">
                <p>Heatmap not available. Run the Python heatmap generator script to create visualizations.</p>
              </div>
            </div>
          </div>
        </>
      );
    }

    // VENUE VIEW
    function VenueView({ data, selectedVenue, setSelectedVenue, selectedEventDate, setSelectedEventDate }) {
      const [venueCompareMode, setVenueCompareMode] = useState('theoretical');
      // Get unique venues
      const venues = {};
      Object.entries(data.event_locations).forEach(([date, event]) => {
        const venueKey = `${event.city}, ${event.state}`;
        if (!venues[venueKey]) {
          venues[venueKey] = {
            city: event.city,
            state: event.state,
            venue: event.venue,
            events: []
          };
        }
        venues[venueKey].events.push({ date, ...event });
      });

      const venueList = Object.keys(venues).sort();

      useEffect(() => {
        if (!selectedVenue && venueList.length > 0) {
          setSelectedVenue(venueList[0]);
        }
      }, [venueList.length]);

      const currentVenue = venues[selectedVenue];
      const eventsAtVenue = currentVenue?.events || [];

      // Calculate theoretical distances for all teams to this venue
      const theoreticalDistances = currentVenue ? Object.keys(data.team_locations).map(teamName => {
        const firstEventDate = eventsAtVenue[0]?.date;
        const distance = data.distances[teamName]?.[firstEventDate];
        
        return {
          team: teamName,
          distance: distance?.one_way_miles || 0,
          roundTrip: distance?.round_trip_miles || 0,
          time: distance?.round_trip_minutes || 0
        };
      }).sort((a, b) => b.roundTrip - a.roundTrip) : [];

      // Get actual attendance if event date selected
      const actualData = selectedEventDate ? data.travel_data.filter(r => r.event_date === selectedEventDate) : [];

      // Calculate venue impact — theoretical or actual
      const venueImpact = venueList.map(venueKey => {
        const venue = venues[venueKey];
        const firstEventDate = venue.events[0]?.date;

        if (venueCompareMode === 'actual') {
          // Actual: total vehicle-miles driven to this venue, averaged per race
          const venueRecords = data.travel_data.filter(r => r.city === venue.city && r.venue === venue.venue);
          const completedDates = new Set(venueRecords.map(r => r.date));
          const raceCount = completedDates.size;
          const totalActualMiles = venueRecords.reduce((sum, r) => sum + r.total_miles_traveled, 0);
          const avgMiles = raceCount > 0 ? totalActualMiles / raceCount : 0;
          return { name: venueKey, venue: venue.venue, totalMiles: totalActualMiles, avgMiles, raceCount };
        } else {
          // Theoretical: avg round-trip if every team attended
          let totalMiles = 0;
          let teamCount = 0;
          Object.keys(data.team_locations).forEach(teamName => {
            const dist = data.distances[teamName]?.[firstEventDate];
            if (dist) {
              totalMiles += dist.round_trip_miles;
              teamCount++;
            }
          });
          const avgMiles = teamCount > 0 ? totalMiles / teamCount : 0;
          return { name: venueKey, venue: venue.venue, totalMiles, avgMiles, raceCount: venue.events.length };
        }
      }).sort((a, b) => a.avgMiles - b.avgMiles);

      const maxAvgMiles = venueImpact.length > 0 ? venueImpact[venueImpact.length - 1].avgMiles : 1;

      return (

                    </div>
                    <div className="w-16 text-xs text-gray-400 text-right">{v.raceCount} race{v.raceCount !== 1 ? 's' : ''}</div>

      const teamData = data.travel_data.filter(r => r.team === selectedTeam);

      // Calculate statistics
      const racesAttended = teamData.length;
      const totalRiders = teamData.reduce((sum, r) => sum + r.riders, 0);

      const totalMiles = teamData.reduce((sum, r) => sum + r.total_miles_traveled, 0);
      const totalMinutes = teamData.reduce((sum, r) => sum + r.total_minutes_traveled, 0);
      const avgMilesPerRace = racesAttended > 0 ? totalMiles / racesAttended : 0;
      
      // Get all theoretical distances for this team
      const allDistances = Object.entries(data.distances[selectedTeam] || {}).map(([date, dist]) => {
        const event = data.event_locations[date];
        const actualAttendance = teamData.find(r => r.event_date === date);
        
        return {
          date,
          venue: event?.venue,
          city: event?.city,
          oneWayMiles: dist.one_way_miles,
          roundTripMiles: dist.round_trip_miles,
          roundTripMinutes: dist.round_trip_minutes,
          attended: !!actualAttendance,
          riders: actualAttendance?.riders || 0,
          actualMiles: actualAttendance?.total_miles_traveled || 0,
          actualMinutes: actualAttendance?.total_minutes_traveled || 0
        };
      }).sort((a, b) => new Date(a.date) - new Date(b.date));

      // Calculate theoretical average
      const avgTheoreticalMiles = allDistances.length > 0 
        ? allDistances.reduce((sum, d) => sum + d.roundTripMiles, 0) / allDistances.length 
        : 0;

      // Per-family cost per season (theoretical: if one parent drove to every race)
      const COST_PER_MILE = 0.725;
      const seasonCosts = {};
      allDistances.forEach(d => {
        const month = parseInt(d.date.split('-')[1]);
        const year = d.date.split('-')[0];
        const season = (month >= 3 && month <= 6) ? `Spring ${year}` : (month >= 9 && month <= 10) ? `Fall ${year}` : `Other ${year}`;
        if (!seasonCosts[season]) seasonCosts[season] = { miles: 0, races: 0 };
        seasonCosts[season].miles += d.roundTripMiles;
        seasonCosts[season].races += 1;
      });
      const seasonCostList = Object.entries(seasonCosts)
        .map(([season, s]) => ({ season, miles: s.miles, cost: s.miles * COST_PER_MILE, races: s.races }))
        .sort((a, b) => b.season.localeCompare(a.season));
      const totalTheoreticalMiles = allDistances.reduce((sum, d) => sum + d.roundTripMiles, 0);
      const totalTheoreticalCost = totalTheoreticalMiles * COST_PER_MILE;

      // Venues ranked by distance
      const venuesByDistance = allDistances
        .reduce((acc, d) => {
          const key = `${d.city} - ${d.venue}`;
          if (!acc.find(v => v.key === key)) {
            acc.push({
              key,
              venue: d.venue,
              city: d.city,
              distance: d.roundTripMiles,
              time: d.roundTripMinutes
            });
          }
          return acc;

      return (

    // COST ANALYSIS VIEW
    function CostAnalysisView({ data, seasons }) {
      const [seasonFilter, setSeasonFilter] = useState(seasons.find(s => s !== 'all') || 'all');

      // Get all event dates for the selected season
      const seasonEventDates = Object.keys(data.event_locations).filter(date => {
        if (seasonFilter === 'all') return true;
        return getSeason(date) === seasonFilter;
      });

      const completedDates = new Set(data.travel_data.map(r => r.date));
      const upcomingCount = seasonEventDates.filter(d => !completedDates.has(d)).length;
      const completedCount = seasonEventDates.length - upcomingCount;

      // Calculate per-family cost for each team (one vehicle round-trip to every race)
      const teamCosts = Object.keys(data.team_locations).filter(t => t !== 'Independent').map(teamName => {
        let totalMiles = 0;
        let raceCount = 0;
        const teamDists = data.distances[teamName] || {};

        seasonEventDates.forEach(date => {
          const dist = teamDists[date];
          if (dist) {
            totalMiles += dist.round_trip_miles;

    // UTILITY FUNCTIONS
    function calculateLeaderboard(filteredData, fullData, viewMode, metricMode, ridersPerVehicle) {
      const teamStats = {};

      if (viewMode === 'actual') {
        filteredData.forEach(record => {
          if (!teamStats[record.team]) {
            teamStats[record.team] = {
              name: record.team,
              miles: 0,
              minutes: 0,
              races: 0,
              riders: 0
            };
          }

          if (metricMode === 'per_rider') {
            // For averages: each rider travels the round-trip distance regardless of carpooling
            teamStats[record.team].miles += record.round_trip_miles * record.riders;
            teamStats[record.team].minutes += record.round_trip_minutes * record.riders;
          } else {
            // For totals: calculate based on vehicles needed
            const vehicles = Math.ceil(record.riders / ridersPerVehicle);
            teamStats[record.team].miles += record.round_trip_miles * vehicles;
            teamStats[record.team].minutes += record.round_trip_minutes * vehicles;
          }
          
          teamStats[record.team].races += 1;
          teamStats[record.team].riders += record.riders;
        });
      } else {
        const uniqueDates = [...new Set(filteredData.map(r => r.date))];
        const allTeams = Object.keys(fullData.team_locations);

        allTeams.forEach(teamName => {
          teamStats[teamName] = {
            name: teamName,
            miles: 0,
            minutes: 0,
            races: 0,
            riders: 0
          };

          uniqueDates.forEach(date => {
            if (fullData.distances[teamName] && fullData.distances[teamName][date]) {
              const dist = fullData.distances[teamName][date];
              teamStats[teamName].miles += dist.round_trip_miles;
              teamStats[teamName].minutes += dist.round_trip_minutes;
              teamStats[teamName].races += 1;
            }
          });
        });
      }

      let leaderboard = Object.values(teamStats);

      // For per_rider mode, divide by total riders to get average
      if (metricMode === 'per_rider' && viewMode === 'actual') {
        leaderboard = leaderboard.map(team => ({
          ...team,
          miles: team.riders > 0 ? team.miles / team.riders : 0,
          minutes: team.riders > 0 ? team.minutes / team.riders : 0
        }));
      }

      leaderboard.sort((a, b) => b.miles - a.miles);

      return leaderboard;
    }

    function isFutureRace(dateStr) {
      return new Date(dateStr + 'T12:00:00') > new Date();
    }

    function getSeason(dateStr) {
      const month = parseInt(dateStr.split('-')[1]);
      const year = dateStr.split('-')[0];
      if (month >= 3 && month <= 6) return `Spring ${year}`;
      if (month >= 9 && month <= 10) return `Fall ${year}`;
      return `Unknown ${year}`;
    }

    const COST_PER_MILE = 0.725;

    function formatTime(minutes) {
      const totalHours = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      if (totalHours >= 48) {
        const days = Math.floor(totalHours / 24);
        const remainHours = totalHours % 24;
        return `${days}d ${remainHours}h`;
      }
      return `${totalHours.toLocaleString()}h ${mins}m`;
    }

    ReactDOM.render(<WSCLDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
