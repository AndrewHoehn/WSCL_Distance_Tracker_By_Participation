    // UTILITY FUNCTIONS
    // ============================================================
    // Distance & Turnout: do teams bring fewer riders to far races?
    // ============================================================

    const TURNOUT_BUCKETS = [
      { label: 'Under 1.5 h', min: 0, max: 90 },
      { label: '1.5 – 3 h', min: 90, max: 180 },
      { label: '3 – 4.5 h', min: 180, max: 270 },
      { label: 'Over 4.5 h', min: 270, max: Infinity },
    ];
    const ABOVE_USUAL = '#2563eb';
    const BELOW_USUAL = '#ea580c';

    // State championships are the last spring race of each year.
    function championshipDates(travelData) {
      const last = {};
      travelData.forEach(r => {
        if (r.season.startsWith('Spring') && (!last[r.season] || r.date > last[r.season])) last[r.season] = r.date;
      });
      return new Set(Object.values(last));
    }

    // Each team-race as a share of that team's median turnout that season.
    // Seasons with fewer than 3 races, or a median under 5 riders, give no baseline.
    function turnoutPoints(records) {
      const groups = {};
      records.forEach(r => {
        const k = r.team + '|' + r.season;
        (groups[k] = groups[k] || []).push(r);
      });
      const points = [];
      Object.values(groups).forEach(rs => {
        if (rs.length < 3) return;
        const sorted = rs.map(r => r.riders).sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        if (median < 5) return;
        rs.forEach(r => points.push({ team: r.team, date: r.date, minutes: r.one_way_minutes, index: r.riders / median }));
      });
      return points;
    }

    function bucketTurnout(points) {
      return TURNOUT_BUCKETS.map(b => {
        const inBucket = points.filter(p => p.minutes >= b.min && p.minutes < b.max);
        const mean = inBucket.length ? inBucket.reduce((s, p) => s + p.index, 0) / inBucket.length : null;
        return { ...b, n: inBucket.length, teams: new Set(inBucket.map(p => p.team)).size, mean };
      });
    }

    const pct = x => `${Math.round(x * 100)}%`;

    function TurnoutView({ data }) {
      const [excludeChamps, setExcludeChamps] = useState(false);
      const [hovered, setHovered] = useState(null);

      const champs = React.useMemo(() => championshipDates(data.travel_data), [data]);
      const allPoints = React.useMemo(() => turnoutPoints(data.travel_data), [data]);
      const noChampPoints = React.useMemo(
        () => turnoutPoints(data.travel_data.filter(r => !champs.has(r.date))), [data, champs]);
      const points = excludeChamps ? noChampPoints : allPoints;
      const buckets = bucketTurnout(points);
      const allBuckets = bucketTurnout(allPoints);
      const noChampBuckets = bucketTurnout(noChampPoints);
      const near = buckets[0].mean;
      const far = buckets[buckets.length - 1].mean;

      // Scale: symmetric around 100%, wide enough for the largest deviation
      const maxDev = Math.max(0.2, ...buckets.filter(b => b.mean !== null).map(b => Math.abs(b.mean - 1))) * 1.15;
      const barPct = b => (Math.abs(b.mean - 1) / maxDev) * 50;

      // Team by team: near (< 3 h) vs far (>= 3 h), for teams with at least 2 of each
      const teamRows = React.useMemo(() => {
        const byTeam = {};
        points.forEach(p => {
          const t = (byTeam[p.team] = byTeam[p.team] || { near: [], far: [] });
          (p.minutes < 180 ? t.near : t.far).push(p.index);
        });
        const avg = xs => xs.reduce((s, x) => s + x, 0) / xs.length;
        return Object.entries(byTeam)
          .filter(([, t]) => t.near.length >= 2 && t.far.length >= 2)
          .map(([team, t]) => ({ team, nearN: t.near.length, farN: t.far.length, near: avg(t.near), far: avg(t.far), diff: avg(t.far) - avg(t.near) }))
          .sort((a, b) => a.diff - b.diff);
      }, [points]);
      const points100 = t => Math.round(t.diff * 100);
      const teamsLower = teamRows.filter(t => points100(t) < 0).length;

      return (
        <>
          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1">Does Distance Cost Riders?</h2>
            <p className="text-sm text-gray-500 mb-4">
              Every team has a usual turnout. This compares each race with that team's own usual that season, grouped by how long the drive was.
            </p>

            {near !== null && far !== null && (
              <div className="bg-gradient-to-br from-orange-50 to-amber-50 border border-orange-200 rounded-lg p-4 mb-5">
                <p className="text-base md:text-lg text-gray-800">
                  Teams bring <strong>{pct(near)}</strong> of their usual riders to races under 1.5 hours from home,
                  and <strong>{pct(far)}</strong> to races more than 4.5 hours away.
                </p>
                <p className="text-sm text-gray-600 mt-2">
                  {excludeChamps
                    ? `With every race included, it's ${pct(allBuckets[0].mean)} versus ${pct(allBuckets[3].mean)}.`
                    : `Leaving out state championships, the gap holds: ${pct(noChampBuckets[0].mean)} versus ${pct(noChampBuckets[3].mean)}.`}
                </p>
              </div>
            )}

            <label className="inline-flex items-center gap-2 text-sm text-gray-700 mb-4 cursor-pointer">
              <input type="checkbox" checked={excludeChamps} onChange={e => setExcludeChamps(e.target.checked)} />
              Leave out state championships
            </label>

            {/* Diverging bars around each team's usual turnout (100%) */}
            <div className="relative" onMouseLeave={() => setHovered(null)}>
              <div className="flex text-xs text-gray-500 mb-1">
                <div className="w-24 md:w-28 shrink-0"></div>
                <div className="flex-1 flex justify-between">
                  <span>fewer riders than usual</span>
                  <span>more than usual</span>
                </div>
              </div>
              {buckets.map((b, i) => (
                <div
                  key={b.label}
                  className={`flex items-center py-2 rounded ${hovered === i ? 'bg-gray-50' : ''}`}
                  onMouseEnter={() => setHovered(i)}
                  onFocus={() => setHovered(i)}
                  tabIndex={0}
                  aria-label={`${b.label} drive: ${b.mean === null ? 'no data' : pct(b.mean)} of usual turnout, ${b.n} team-races`}
                >
                  <div className="w-24 md:w-28 shrink-0 text-sm font-medium text-gray-700">{b.label}</div>
                  <div className="flex-1 relative h-7">
                    <div className="absolute top-0 bottom-0 left-1/2 w-px bg-gray-400"></div>
                    {b.mean !== null && (
                      <>
                        <div
                          className="absolute top-1 h-5"
                          style={{
                            backgroundColor: b.mean >= 1 ? ABOVE_USUAL : BELOW_USUAL,
                            left: b.mean >= 1 ? '50%' : `${50 - barPct(b)}%`,
                            width: `${barPct(b)}%`,
                            borderRadius: b.mean >= 1 ? '0 4px 4px 0' : '4px 0 0 4px',
                          }}
                        ></div>
                        <span
                          className="absolute top-1 text-sm font-semibold text-gray-800 whitespace-nowrap"
                          style={b.mean >= 1
                            ? { left: `calc(${50 + barPct(b)}% + 6px)` }
                            : { right: `calc(${50 + barPct(b)}% + 6px)` }}
                        >
                          {pct(b.mean)}
                        </span>
                      </>
                    )}
                  </div>
                </div>
              ))}
              <div className="flex text-xs text-gray-500 mt-1">
                <div className="w-24 md:w-28 shrink-0 text-gray-400">one-way drive</div>
                <div className="flex-1 text-center">100% = the team's usual turnout that season</div>
              </div>
              {hovered !== null && buckets[hovered].mean !== null && (
                <div className="mt-2 text-xs text-gray-600 bg-gray-50 border border-gray-200 rounded px-3 py-2">
                  <strong>{buckets[hovered].label}:</strong> {buckets[hovered].n} team-races across {buckets[hovered].teams} teams averaged {pct(buckets[hovered].mean)} of usual turnout.
                </div>
              )}
            </div>

            <div className="overflow-x-auto mt-5">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b-2 border-gray-200">
                    <th className="text-left py-2 px-3 font-semibold text-gray-700">One-way drive</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">Team-races</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">Teams</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">Turnout vs usual</th>
                  </tr>
                </thead>
                <tbody>
                  {buckets.map(b => (
                    <tr key={b.label} className="border-b border-gray-100">
                      <td className="py-2 px-3 text-gray-800">{b.label}</td>
                      <td className="py-2 px-3 text-right text-gray-600" style={{fontVariantNumeric: 'tabular-nums'}}>{b.n}</td>
                      <td className="py-2 px-3 text-right text-gray-600" style={{fontVariantNumeric: 'tabular-nums'}}>{b.teams}</td>
                      <td className="py-2 px-3 text-right font-semibold text-gray-800" style={{fontVariantNumeric: 'tabular-nums'}}>{b.mean === null ? '–' : pct(b.mean)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
            <h2 className="text-xl font-bold text-gray-800 mb-1">Team by Team</h2>
            <p className="text-sm text-gray-500 mb-4">
              Turnout at races under 3 hours away versus 3 hours or more, for teams with at least two of each.
              {teamRows.length > 0 && ` ${teamsLower} of ${teamRows.length} teams bring fewer riders to the far races.`}
            </p>
            <div className="overflow-x-auto -mx-4 md:mx-0">
              <table className="w-full min-w-[520px] text-sm">
                <thead>
                  <tr className="border-b-2 border-gray-200">
                    <th className="text-left py-2 px-3 font-semibold text-gray-700">Team</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">Under 3 h</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">3 h or more</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-700">Difference</th>
                  </tr>
                </thead>
                <tbody>
                  {teamRows.map(t => (
                    <tr key={t.team} className="border-b border-gray-100 hover:bg-gray-50">
                      <td className="py-2 px-3 font-medium text-gray-800">{t.team}</td>
                      <td className="py-2 px-3 text-right text-gray-600" style={{fontVariantNumeric: 'tabular-nums'}}>{pct(t.near)} <span className="text-gray-400">({t.nearN})</span></td>
                      <td className="py-2 px-3 text-right text-gray-600" style={{fontVariantNumeric: 'tabular-nums'}}>{pct(t.far)} <span className="text-gray-400">({t.farN})</span></td>
                      <td className="py-2 px-3 text-right font-semibold text-gray-800" style={{fontVariantNumeric: 'tabular-nums'}}>
                        {points100(t) > 0 ? '+' : points100(t) < 0 ? '−' : ''}{Math.abs(points100(t))} pts
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="text-xs text-gray-400 mt-2">Numbers in parentheses are race counts. Small counts swing a lot.</p>
          </div>

          <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
            <h2 className="text-lg font-bold text-gray-800 mb-2">What This Does and Doesn't Show</h2>
            <ul className="text-sm text-gray-600 space-y-2 list-disc pl-5">
              <li>Each team is compared only with itself in the same season, so big teams, small teams, and growing rosters don't skew it.</li>
              <li>Fall seasons have one or two races, too few to set a team's usual turnout, so the numbers come from spring seasons.</li>
              <li>It's a pattern, not proof. Far races also mean overnight stays, school conflicts, and early wake-ups, and this can't separate those from the miles themselves.</li>
              <li>Riders are competitive finishers from the league's published results, so a rider who started and didn't finish isn't counted.</li>
            </ul>
          </div>
        </>
      );
    }

    // ============================================================
    // Venue weighting and the season builder
    // ============================================================

    // Average riders per race for each team over the 12 months before the latest race.
    function recentRidersByTeam(data) {
      const latest = data.travel_data.reduce((m, r) => (r.date > m ? r.date : m), '');
      const cutoff = new Date(latest + 'T12:00:00');
      cutoff.setFullYear(cutoff.getFullYear() - 1);
      const since = cutoff.toISOString().slice(0, 10);
      const sums = {};
      data.travel_data.filter(r => r.date > since).forEach(r => {
        const t = (sums[r.team] = sums[r.team] || { riders: 0, races: 0 });
        t.riders += r.riders;
        t.races += 1;
      });
      const out = {};
      Object.entries(sums).forEach(([team, t]) => { out[team] = t.riders / t.races; });
      return out;
    }

    // Example seasons, found by checking every schedule that uses each venue at most once
    const SEASON_EXAMPLES = [
      { id: 'fair5', label: 'Fairest 5 races', races: 5, metric: 'gap', pick: 'min',
        blurb: 'the smallest gap between the farthest- and closest-driving team' },
      { id: 'least5', label: 'Least driving, 5 races', races: 5, metric: 'avg', pick: 'min',
        blurb: 'the fewest miles for the typical family, weighting each team by its riders' },
      { id: 'unfair5', label: 'Least fair, 5 races', races: 5, metric: 'gap', pick: 'max',
        blurb: 'the biggest gap between the farthest- and closest-driving team' },
      { id: 'most5', label: 'Most driving, 5 races', races: 5, metric: 'avg', pick: 'max',
        blurb: 'the most miles for the typical family' },
      { id: 'unfair2', label: 'Least fair, 2 races', races: 2, metric: 'gap', pick: 'max',
        blurb: 'the biggest gap between the farthest- and closest-driving team' },
      { id: 'most2', label: 'Most driving, 2 races', races: 2, metric: 'avg', pick: 'max',
        blurb: 'the most miles for the typical family' },
    ];

    function combinations(items, k) {
      if (k === 0) return [[]];
      if (items.length < k) return [];
      const [first, ...rest] = items;
      return [...combinations(rest, k - 1).map(c => [first, ...c]), ...combinations(rest, k)];
    }

    function SeasonBuilder({ data, venues, venueList }) {
      const weights = React.useMemo(() => recentRidersByTeam(data), [data]);
      const seasonList = React.useMemo(() => {
        const key = s => {
          const m = s.match(/(Spring|Fall)\s+(\d{4})/);
          return m ? parseInt(m[2]) * 2 + (m[1] === 'Fall' ? 1 : 0) : -Infinity;
        };
        return [...new Set(Object.keys(data.event_locations).map(getSeason))].sort((a, b) => key(b) - key(a));
      }, [data]);
      const venueOf = date => {
        const e = data.event_locations[date];
        return `${e.city}, ${e.state}`;
      };
      const presetCounts = season => {
        const counts = {};
        Object.keys(data.event_locations).filter(d => getSeason(d) === season).forEach(d => {
          counts[venueOf(d)] = (counts[venueOf(d)] || 0) + 1;
        });
        return counts;
      };
      const defaultSeason = seasonList.find(s => s.startsWith('Spring')) || seasonList[0];
      const [preset, setPreset] = useState(defaultSeason);
      const [counts, setCounts] = useState(() => presetCounts(defaultSeason));
      const [example, setExample] = useState(null);

      const applyPreset = season => {
        setPreset(season);
        setCounts(presetCounts(season));
        setExample(null);
      };
      const setCount = (venueKey, n) => {
        setCounts(c => ({ ...c, [venueKey]: Math.max(0, Math.min(3, n)) }));
        setExample(null);
      };

      // One family's round trips for a schedule, for every team active in the last year
      const evaluate = schedule => {
        const teams = Object.keys(weights).filter(t => data.distances[t]);
        const rows = teams.map(team => {
          let miles = 0, minutes = 0;
          Object.entries(schedule).forEach(([venueKey, n]) => {
            if (!n) return;
            const dist = data.distances[team][venues[venueKey].events[0].date];
            if (dist) { miles += dist.round_trip_miles * n; minutes += dist.round_trip_minutes * n; }
          });
          return { team, miles, minutes, weight: weights[team] };
        }).sort((a, b) => b.miles - a.miles);
        const totalWeight = rows.reduce((s, r) => s + r.weight, 0);
        const avg = totalWeight ? rows.reduce((s, r) => s + r.miles * r.weight, 0) / totalWeight : 0;
        const farthest = rows[0];
        const closest = rows[rows.length - 1];
        return { rows, avg, farthest, closest, gap: closest && closest.miles > 0 ? farthest.miles / closest.miles : 0 };
      };

      // Best and worst schedules for each example, from every combination of distinct venues
      const examples = React.useMemo(() => {
        const bySize = {};
        const found = {};
        SEASON_EXAMPLES.forEach(ex => {
          if (!bySize[ex.races]) {
            bySize[ex.races] = combinations(venueList, ex.races).map(combo => {
              const schedule = Object.fromEntries(combo.map(v => [v, 1]));
              return { combo, schedule, ...evaluate(schedule) };
            });
          }
          const options = bySize[ex.races];
          const best = options.reduce((a, b) => {
            const better = ex.pick === 'min' ? b[ex.metric] < a[ex.metric] : b[ex.metric] > a[ex.metric];
            return better ? b : a;
          });
          found[ex.id] = { ...ex, ...best, considered: options.length };
        });
        return found;
      }, [data, weights, venueList]);
      const applyExample = id => {
        setCounts({ ...examples[id].schedule });
        setExample(id);
      };
      const activeExample = example && examples[example];
      const sameAs = activeExample && SEASON_EXAMPLES
        .filter(ex => ex.id !== example && ex.races === activeExample.races)
        .find(ex => examples[ex.id].combo.join('|') === activeExample.combo.join('|'));

      const races = Object.values(counts).reduce((s, n) => s + n, 0);
      const result = evaluate(counts);
      const baseCounts = presetCounts(preset);
      const baseline = evaluate(baseCounts);
      const changed = venueList.some(v => (counts[v] || 0) !== (baseCounts[v] || 0));
      const baseRaces = Object.values(baseCounts).reduce((s, n) => s + n, 0);
      const comparable = changed && races === baseRaces;
      const maxMiles = result.rows.length ? result.rows[0].miles : 1;
      const fmt = x => x.toLocaleString(undefined, { maximumFractionDigits: 0 });
      const delta = (now, base) => {
        const d = now - base;
        if (Math.abs(d) < 0.5) return null;
        return <span className={d > 0 ? 'text-orange-600' : 'text-green-600'}>{d > 0 ? '+' : '−'}{fmt(Math.abs(d))}</span>;
      };

      return (
        <div className="bg-white rounded-lg shadow-lg p-4 md:p-6 mb-6">
          <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1">Build a Season</h2>
          <p className="text-sm text-gray-500 mb-4">
            Pick the venues for a season and see what it asks of each family: one car's round trips to every race.
            Starts from a real season; change the counts to try a different schedule.
          </p>

          <div className="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-2">Start from</label>
              <select
                value={preset}
                onChange={e => applyPreset(e.target.value)}
                className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 mb-4"
              >
                {seasonList.map(s => <option key={s} value={s}>{s} schedule</option>)}
              </select>
              <div className="text-sm font-semibold text-gray-700 mb-2">Or try an example</div>
              <div className="flex flex-wrap gap-2 mb-4">
                {SEASON_EXAMPLES.map(ex => (
                  <button
                    key={ex.id}
                    onClick={() => applyExample(ex.id)}
                    className={`px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${
                      example === ex.id
                        ? 'bg-blue-600 border-blue-600 text-white'
                        : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'
                    }`}
                  >
                    {ex.label}
                  </button>
                ))}
              </div>
              <div className="border border-gray-200 rounded-lg divide-y divide-gray-100">
                {venueList.map(v => {
                  const n = counts[v] || 0;
                  return (
                    <div key={v} className={`flex items-center justify-between px-3 py-2 ${n ? '' : 'opacity-60'}`}>
                      <div className="min-w-0">
                        <div className="text-sm font-medium text-gray-800 truncate">{venues[v].venue}</div>
                        <div className="text-xs text-gray-500">{v}</div>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          onClick={() => setCount(v, n - 1)}
                          className="w-8 h-8 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-40"
                          disabled={n === 0}
                          aria-label={`One fewer race at ${venues[v].venue}`}
                        >−</button>
                        <span className="w-6 text-center text-sm font-semibold text-gray-800" style={{fontVariantNumeric: 'tabular-nums'}}>{n}</span>
                        <button
                          onClick={() => setCount(v, n + 1)}
                          className="w-8 h-8 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-40"
                          disabled={n === 3}
                          aria-label={`One more race at ${venues[v].venue}`}
                        >+</button>
                      </div>
                    </div>
                  );
                })}
              </div>
              {changed && (
                <button onClick={() => applyPreset(preset)} className="mt-3 text-sm text-blue-600 hover:underline block">
                  Reset to {preset} as raced
                </button>
              )}
            </div>

            <div>
              {activeExample && (
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4 text-sm text-gray-700">
                  <strong>{activeExample.label}:</strong> {activeExample.combo.map(v => venues[v].venue).join(', ')}.
                  {' '}Out of all {activeExample.considered} seasons that use {activeExample.races} different venues, this one has {activeExample.blurb}.
                  {sameAs && <> It's the same schedule as <em>{sameAs.label.toLowerCase()}</em>.</>}
                  {(example === 'least5' || example === 'unfair5') && examples.least5.combo.join('|') === examples.unfair5.combo.join('|') &&
                    <> Keeping total driving low means racing where most teams live, which leaves the teams far from that cluster driving the most.</>}
                </div>
              )}
              {races === 0 ? (
                <div className="text-sm text-gray-500 p-6 text-center border border-dashed border-gray-300 rounded-lg">Add at least one race to see the season.</div>
              ) : (
                <>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                    <div className="bg-gray-50 rounded-lg p-3">
                      <div className="text-xs text-gray-500">Races</div>
                      <div className="text-2xl font-bold text-gray-800">{races}</div>
                    </div>
                    <div className="bg-gray-50 rounded-lg p-3">
                      <div className="text-xs text-gray-500">Typical family</div>
                      <div className="text-2xl font-bold text-blue-600">{fmt(result.avg)} mi</div>
                      <div className="text-xs text-gray-500">{comparable ? <>vs {preset}: {delta(result.avg, baseline.avg) || 'same'}</> : 'weighted by riders'}</div>
                    </div>
                    <div className="bg-gray-50 rounded-lg p-3">
                      <div className="text-xs text-gray-500">Farthest family</div>
                      <div className="text-2xl font-bold text-orange-600">{fmt(result.farthest.miles)} mi</div>
                      <div className="text-xs text-gray-500 truncate" title={result.farthest.team}>{result.farthest.team}</div>
                    </div>
                    <div className="bg-gray-50 rounded-lg p-3">
                      <div className="text-xs text-gray-500">Gap</div>
                      <div className="text-2xl font-bold text-purple-600">{result.gap ? `${result.gap.toFixed(1)}×` : '–'}</div>
                      <div className="text-xs text-gray-500">
                        {comparable && baseline.gap ? `${preset}: ${baseline.gap.toFixed(1)}×` : `vs ${result.closest.team}`}
                      </div>
                    </div>
                  </div>

                  <div className="text-xs text-gray-500 mb-2">Season miles for one family, by team (cost at ${COST_PER_MILE}/mi)</div>
                  <div className="space-y-1.5">
                    {result.rows.map(r => (
                      <div key={r.team} className="flex items-center gap-2" title={`${r.team}: ${fmt(r.miles)} mi, ${formatTime(r.minutes)} in the car, $${fmt(r.miles * COST_PER_MILE)}`}>
                        <div className="w-28 md:w-40 text-xs md:text-sm text-gray-700 truncate shrink-0">{r.team}</div>
                        <div className="flex-1 flex items-center gap-2 min-w-0">
                          <div className="h-4 rounded-r bg-blue-500 transition-all duration-300" style={{ width: `${maxMiles ? (r.miles / maxMiles) * 70 : 0}%` }}></div>
                          <span className="text-xs text-gray-700 whitespace-nowrap" style={{fontVariantNumeric: 'tabular-nums'}}>
                            {fmt(r.miles)} mi · ${fmt(r.miles * COST_PER_MILE)}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-gray-400 mt-3">
                    Teams that raced in the last 12 months. "Typical family" weights each team by its average riders per race, so a 40-rider team counts more than a 4-rider team.
                  </p>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function calculateLeaderboard(filteredData, fullData, viewMode, metricMode, ridersPerVehicle) {
      const teamStats = {};

      if (viewMode === 'actual') {
        filteredData.forEach(record => {
          if (!teamStats[record.team]) {
            teamStats[record.team] = {
              name: record.team,
              miles: 0,
              minutes: 0,
              races: 0,
              riders: 0
            };
          }

          if (metricMode === 'per_family') {
            // One family, one car, to every race the team attended
            teamStats[record.team].miles += record.round_trip_miles;
            teamStats[record.team].minutes += record.round_trip_minutes;
          } else if (metricMode === 'per_rider') {
            // For averages: each rider travels the round-trip distance regardless of carpooling
            teamStats[record.team].miles += record.round_trip_miles * record.riders;
            teamStats[record.team].minutes += record.round_trip_minutes * record.riders;
          } else {
            // For totals: calculate based on vehicles needed
            const vehicles = Math.ceil(record.riders / ridersPerVehicle);
            teamStats[record.team].miles += record.round_trip_miles * vehicles;
            teamStats[record.team].minutes += record.round_trip_minutes * vehicles;
          }
          
          teamStats[record.team].races += 1;
          teamStats[record.team].riders += record.riders;
        });
      } else {
        const uniqueDates = [...new Set(filteredData.map(r => r.date))];
        const allTeams = Object.keys(fullData.team_locations);

        allTeams.forEach(teamName => {
          teamStats[teamName] = {
            name: teamName,
            miles: 0,
            minutes: 0,
            races: 0,
            riders: 0
          };

          uniqueDates.forEach(date => {
            if (fullData.distances[teamName] && fullData.distances[teamName][date]) {
              const dist = fullData.distances[teamName][date];
              teamStats[teamName].miles += dist.round_trip_miles;
              teamStats[teamName].minutes += dist.round_trip_minutes;
              teamStats[teamName].races += 1;
            }
          });
        });
      }

      let leaderboard = Object.values(teamStats);

      // For per_rider mode, divide by total riders to get average
      if (metricMode === 'per_rider' && viewMode === 'actual') {
        leaderboard = leaderboard.map(team => ({
          ...team,
          miles: team.riders > 0 ? team.miles / team.riders : 0,
          minutes: team.riders > 0 ? team.minutes / team.riders : 0
        }));
      }

      // Per family: average round trip per race, keeping the one-car total alongside
      if (metricMode === 'per_family') {
        leaderboard = leaderboard.map(team => ({
          ...team,
          totalMiles: team.miles,
          miles: team.races > 0 ? team.miles / team.races : 0,
          minutes: team.races > 0 ? team.minutes / team.races : 0
        }));
      }

      leaderboard.sort((a, b) => b.miles - a.miles);

      return leaderboard;
    }

    function isFutureRace(dateStr) {
      return new Date(dateStr + 'T12:00:00') > new Date();
    }

    function getSeason(dateStr) {
      const month = parseInt(dateStr.split('-')[1]);
      const year = dateStr.split('-')[0];
      if (month >= 3 && month <= 6) return `Spring ${year}`;
      if (month >= 9 && month <= 10) return `Fall ${year}`;
      return `Unknown ${year}`;
    }

    const COST_PER_MILE = 0.725;

    function formatTime(minutes) {
      const totalHours = Math.floor(minutes / 60);
      const mins = Math.round(minutes % 60);
      if (totalHours >= 48) {
        const days = Math.floor(totalHours / 24);
        const remainHours = totalHours % 24;
        return `${days}d ${remainHours}h`;
      }
      return `${totalHours.toLocaleString()}h ${mins}m`;
    }

    // ============================================================
    // Race Day animated convergence view
    // ============================================================

    const RACE_DAY_PALETTE = [
      '#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94',
      '#95e1d3', '#fce38a', '#ff9aa2', '#c7ceea', '#b5ead7',
      '#ffdac1', '#e2f0cb', '#f1c0e8', '#cfbaf0', '#a3c4f3',
      '#90dbf4', '#8eecf5', '#98f5e1', '#b9fbc0', '#fbf8cc',
      '#ffcfd2', '#f1c0e8', '#cfbaf0', '#a3c4f3', '#bbfa89',
      '#f9e784', '#fcb392', '#f47b7b', '#5eead4', '#93c5fd',
      '#fda4af', '#fdba74', '#fde047', '#bef264', '#86efac',
      '#67e8f9', '#a5b4fc', '#c4b5fd', '#f0abfc', '#fb7185',
    ];

    function precomputeRoute(points) {
      const cum = [0];
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        const [lat1, lng1] = points[i-1];
        const [lat2, lng2] = points[i];
        const dlat = lat2 - lat1;
        const dlng = (lng2 - lng1) * Math.cos(lat1 * Math.PI / 180);
        const seg = Math.sqrt(dlat * dlat + dlng * dlng);
        total += seg;
        cum.push(total);
      }
      return { points, cum, total };
    }

    function pointAt(route, frac) {
      const { points, cum, total } = route;
      if (frac <= 0) return points[0];
      if (frac >= 1) return points[points.length - 1];
      const target = frac * total;
      let lo = 0, hi = cum.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] < target) lo = mid + 1; else hi = mid;
      }
      const i = Math.max(1, lo);
      const segFrac = (target - cum[i-1]) / (cum[i] - cum[i-1] || 1);
      const [lat1, lng1] = points[i-1];
      const [lat2, lng2] = points[i];
      return [lat1 + (lat2 - lat1) * segFrac, lng1 + (lng2 - lng1) * segFrac];
    }

    // ConvergenceAnimation: core reusable animated convergence map.
    // Accepts a list of races and a default date; handles map rendering,
    // animation, controls, and sidebar. Used by both RaceDayView and VenueView.
    function ConvergenceAnimation({ races, title, description, height = '600px', compact = false, showSidebar = true }) {
      const [selectedDate, setSelectedDate] = useState(() => races && races.length > 0 ? races[0].date : null);
      const [speed, setSpeed] = useState(1);
      const [clock, setClock] = useState('0:00');
      const [playing, setPlaying] = useState(false);
      const [finished, setFinished] = useState(false);
      const [stats, setStats] = useState(null);
      const [arrivedTeams, setArrivedTeams] = useState(() => new Set());

      const mapContainerRef = React.useRef(null);
      const mapRef = React.useRef(null);
      const animRef = React.useRef({ trips: [], venueMarker: null, homeMarkers: [], startTs: null, pausedElapsed: 0, raf: null, longestMin: 0 });
      const speedRef = React.useRef(speed);
      const autoPlayPendingRef = React.useRef(false);
      const playingRef = React.useRef(false);
      const finishedRef = React.useRef(false);

      React.useEffect(() => { speedRef.current = speed; }, [speed]);
      React.useEffect(() => { playingRef.current = playing; }, [playing]);
      React.useEffect(() => { finishedRef.current = finished; }, [finished]);

      const ANIM_BASE_SECONDS = 8;
      const animDurationMs = () => (ANIM_BASE_SECONDS / speedRef.current) * 1000;

      // If the race list changes (e.g. different venue selected), reset selection
      React.useEffect(() => {
        if (races && races.length > 0) {
          const stillValid = races.some(r => r.date === selectedDate);
          if (!stillValid) setSelectedDate(races[0].date);
        } else {
          setSelectedDate(null);
        }
      }, [races]);

      // Init map when container is ready
      React.useEffect(() => {
        if (!mapContainerRef.current || mapRef.current) return;
        const m = L.map(mapContainerRef.current, { preferCanvas: true, zoomControl: true }).setView([47.5, -120.5], 7);
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png${cartoKey}`, {
          attribution: '© OpenStreetMap contributors, © CARTO',
          subdomains: 'abcd',
          maxZoom: 19,
        }).addTo(m);
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png${cartoKey}`, {
          subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
        }).addTo(m);
        mapRef.current = m;
        // Fix sizing after mount (Leaflet needs an invalidateSize when container was hidden)
        setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 100);
        return () => {
          if (animRef.current.raf) cancelAnimationFrame(animRef.current.raf);
          if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
        };
      }, []);

      // Load a race
      const loadRace = React.useCallback((date) => {
        if (!races || !mapRef.current || !date) return;
        const race = races.find(r => r.date === date);
        if (!race) return;
        const map = mapRef.current;

        // Stop any running animation
        if (animRef.current.raf) cancelAnimationFrame(animRef.current.raf);
        animRef.current.raf = null;
        animRef.current.startTs = null;
        animRef.current.pausedElapsed = 0;

        // Remove previous layers
        for (const t of animRef.current.trips) {
          if (t.trailLayer) map.removeLayer(t.trailLayer);
          if (t.dotLayer) map.removeLayer(t.dotLayer);
        }
        for (const h of animRef.current.homeMarkers) map.removeLayer(h);
        if (animRef.current.venueMarker) map.removeLayer(animRef.current.venueMarker);

        const longestMin = Math.max(...race.trips.map(t => t.m));
        const shortestMin = Math.min(...race.trips.map(t => t.m));
        const fleetMinutes = race.trips.reduce((s, t) => s + t.m * t.r, 0);

        const trips = race.trips.map((trip, i) => {
          const route = precomputeRoute(trip.p);
          const color = RACE_DAY_PALETTE[i % RACE_DAY_PALETTE.length];
          const trailLayer = L.polyline([], { color, weight: 3, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(map);
          const dotLayer = L.circleMarker(trip.h, { radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map);
          dotLayer.bindTooltip(trip.t, { permanent: false, direction: 'top', offset: [0, -8] });
          return { trip, route, color, trailLayer, dotLayer, arrived: false };
        });

        const homeMarkers = race.trips.map(trip =>
          L.circleMarker(trip.h, { radius: 3, color: '#30363d', weight: 1, fillColor: '#6e7681', fillOpacity: 0.9, interactive: false }).addTo(map)
        );

        const venueMarker = L.marker(race.vl, {
          icon: L.divIcon({
            className: 'race-day-venue-icon',
            html: `<div style="background:#f85149;color:white;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.5);white-space:nowrap;">🏁 ${race.venue}</div>`,
            iconAnchor: [40, 12],
          })
        }).addTo(map);

        const allPoints = race.trips.flatMap(t => t.p).concat([race.vl]).concat(race.trips.map(t => t.h));
        map.fitBounds(L.latLngBounds(allPoints), { padding: [40, 40] });

        animRef.current = { ...animRef.current, trips, venueMarker, homeMarkers, longestMin, startTs: null, pausedElapsed: 0, raf: null };

        // Sort trips for arrival list
        const sortedTrips = [...trips].sort((a, b) => a.trip.m - b.trip.m);
        setStats({
          race,
          longestMin,
          shortestMin,
          fleetMinutes,
          teamCount: race.trips.length,
          sortedTrips,
        });
        setClock('0:00');
        setPlaying(false);
        setFinished(false);
        setArrivedTeams(new Set());
        // Queue up autoplay: fire when the map scrolls into view (or immediately if it's already in view).
        autoPlayPendingRef.current = true;
      }, [races]);

      // React to date change
      React.useEffect(() => {
        if (selectedDate) loadRace(selectedDate);
      }, [selectedDate, loadRace]);

      // Animation step
      const step = React.useCallback((timestamp) => {
        const state = animRef.current;
        if (state.startTs === null) state.startTs = timestamp - state.pausedElapsed;
        const elapsed = timestamp - state.startTs;
        const dur = animDurationMs();
        const progress = Math.min(1, elapsed / dur);

        const newlyArrived = new Set();
        for (const t of state.trips) {
          const frac = Math.min(1, progress * (state.longestMin / t.trip.m));
          const pt = pointAt(t.route, frac);
          const target = frac * t.route.total;
          const trail = [];
          for (let i = 0; i < t.route.points.length; i++) {
            if (t.route.cum[i] <= target) trail.push(t.route.points[i]);
            else break;
          }
          trail.push(pt);
          t.trailLayer.setLatLngs(trail);
          t.dotLayer.setLatLng(pt);
          if (frac >= 1 && !t.arrived) {
            t.arrived = true;
            newlyArrived.add(t.trip.t);
          }
        }

        if (newlyArrived.size > 0) {
          setArrivedTeams(prev => {
            const next = new Set(prev);
            newlyArrived.forEach(n => next.add(n));
            return next;
          });
        }

        const simMinutes = Math.min(state.longestMin, (elapsed / dur) * state.longestMin);
        const h = Math.floor(simMinutes / 60);
        const m = Math.floor(simMinutes % 60);
        setClock(`${h}:${String(m).padStart(2, '0')}`);

        if (progress >= 1) {
          state.raf = null;
          state.startTs = null;
          state.pausedElapsed = 0;
          setPlaying(false);
          setFinished(true);
          return;
        }
        state.raf = requestAnimationFrame(step);
      }, []);

      const handlePlay = () => {
        if (!stats) return;
        if (playing) {
          // Pause
          const state = animRef.current;
          if (state.raf) cancelAnimationFrame(state.raf);
          state.raf = null;
          const now = performance.now();
          if (state.startTs !== null) state.pausedElapsed = now - state.startTs;
          state.startTs = null;
          setPlaying(false);
        } else {
          // Play (or replay if finished)
          if (finished) { handleReplay(); return; }
          setPlaying(true);
          animRef.current.startTs = null;
          animRef.current.raf = requestAnimationFrame(step);
        }
      };

      // IntersectionObserver: autoplay when the map scrolls into view (or immediately, if already visible).
      // Fires once per "pending" flag — set by loadRace when a new race is loaded.
      React.useEffect(() => {
        if (!mapContainerRef.current) return;
        const el = mapContainerRef.current;
        const maybeStart = () => {
          if (!autoPlayPendingRef.current) return;
          if (playingRef.current || finishedRef.current) return;
          if (animRef.current.trips.length === 0) return;
          autoPlayPendingRef.current = false;
          setPlaying(true);
          animRef.current.startTs = null;
          animRef.current.raf = requestAnimationFrame(step);
        };
        const observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) maybeStart(); });
        }, { threshold: 0.3 });
        observer.observe(el);
        // Also poll briefly in case the map loaded while already on-screen — IntersectionObserver fires
        // on setup too, but we want a small grace period for stats/trips to populate.
        const t1 = setTimeout(maybeStart, 300);
        const t2 = setTimeout(maybeStart, 900);
        return () => { observer.disconnect(); clearTimeout(t1); clearTimeout(t2); };
      }, [step]);


      const handleReplay = () => {
        if (!stats) return;
        // Reset animation
        const state = animRef.current;
        if (state.raf) cancelAnimationFrame(state.raf);
        state.raf = null;
        state.startTs = null;
        state.pausedElapsed = 0;
        for (const t of state.trips) {
          t.trailLayer.setLatLngs([]);
          t.dotLayer.setLatLng(t.trip.h);
          t.arrived = false;
        }
        setClock('0:00');
        setArrivedTeams(new Set());
        setFinished(false);
        setPlaying(true);
        state.raf = requestAnimationFrame(step);
      };

      if (!races) {
        return (
          <div className="bg-white rounded-lg shadow-lg p-6">
            {title && <h2 className="text-xl font-bold text-gray-800 mb-2">{title}</h2>}
            <p className="text-gray-500">Loading route data…</p>
          </div>
        );
      }

      if (races.length === 0) {
        return (
          <div className="bg-white rounded-lg shadow-lg p-6">
            {title && <h2 className="text-xl font-bold text-gray-800 mb-2">{title}</h2>}
            <p className="text-gray-500">No route data available for this selection.</p>
          </div>
        );
      }

      return (
        <div className={compact ? '' : 'space-y-6'}>
          <div className={`bg-white rounded-lg shadow-lg ${compact ? 'p-4' : 'p-4 md:p-6'}`}>
            {(title || description) && (
              <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-3 mb-4">
                <div>
                  {title && <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1">{title}</h2>}
                  {description && <p className="text-sm text-gray-500">{description}</p>}
                </div>
              </div>
            )}

            <div className="flex flex-wrap gap-3 items-center mb-4">
              {races.length > 1 && (
                <div className="flex items-center gap-2">
                  <label className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Race</label>
                  <select
                    value={selectedDate || ''}
                    onChange={e => setSelectedDate(e.target.value)}
                    className="border border-gray-300 rounded px-3 py-1.5 text-sm min-w-[240px] bg-white"
                  >
                    {races.map(r => (
                      <option key={r.date} value={r.date}>{r.date} — {r.venue} ({r.city})</option>
                    ))}
                  </select>
                </div>
              )}
              <div className="flex items-center gap-2">
                <button
                  onClick={handlePlay}
                  disabled={!stats}
                  className={`px-4 py-1.5 rounded font-semibold text-sm text-white ${playing ? 'bg-amber-600 hover:bg-amber-700' : 'bg-green-600 hover:bg-green-700'} disabled:bg-gray-300`}
                >
                  {playing ? '❚❚ Pause' : (finished ? '↻ Play Again' : '▶ Play')}
                </button>
                <button
                  onClick={handleReplay}
                  disabled={!stats}
                  className="px-3 py-1.5 rounded font-semibold text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50"
                >
                  ↻ Replay
                </button>
              </div>
              <div className="flex items-center gap-2">
                <label className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Speed</label>
                <input
                  type="range" min="0.5" max="5" step="0.5"
                  value={speed}
                  onChange={e => setSpeed(parseFloat(e.target.value))}
                  className="w-24"
                />
                <span className="text-sm text-gray-700 tabular-nums min-w-[24px]">{speed}×</span>
              </div>
            </div>

            <div className={`grid grid-cols-1 gap-4 ${showSidebar ? 'lg:grid-cols-[1fr_280px]' : ''}`}>
              <div className="relative">
                <div ref={mapContainerRef} style={{ width: '100%', height, borderRadius: '8px', overflow: 'hidden' }} />
              </div>

              {showSidebar && (
              <div className="space-y-3">
                <div className="bg-gray-900 text-white rounded-lg p-4 text-center">
                  <div className="text-4xl font-bold tabular-nums">{clock}</div>
                  <div className="text-xs text-gray-400 uppercase tracking-wide mt-1">Elapsed drive time</div>
                </div>

                {stats && (
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-gray-50 rounded p-2">
                      <div className="text-xs text-gray-500 uppercase">Teams</div>
                      <div className="text-lg font-bold text-gray-800">{stats.teamCount}</div>
                    </div>
                    <div className="bg-gray-50 rounded p-2">
                      <div className="text-xs text-gray-500 uppercase">Longest</div>
                      <div className="text-lg font-bold text-gray-800">{formatTime(stats.longestMin)}</div>
                    </div>
                    <div className="bg-gray-50 rounded p-2">
                      <div className="text-xs text-gray-500 uppercase">Shortest</div>
                      <div className="text-lg font-bold text-gray-800">{formatTime(stats.shortestMin)}</div>
                    </div>
                    <div className="bg-gray-50 rounded p-2">
                      <div className="text-xs text-gray-500 uppercase">Fleet-hrs</div>
                      <div className="text-lg font-bold text-gray-800">{(stats.fleetMinutes / 60).toFixed(0)}</div>
                    </div>
                  </div>
                )}

                {stats && (
                  <div>
                    <div className="text-xs text-gray-500 uppercase tracking-wide font-semibold mb-2">Arrival Order</div>
                    <div className="max-h-[340px] overflow-y-auto border border-gray-200 rounded">
                      {stats.sortedTrips.map(t => {
                        const arrived = arrivedTeams.has(t.trip.t);
                        return (
                          <div key={t.trip.t} className={`flex items-center justify-between px-2 py-1.5 text-xs border-b border-gray-100 ${arrived ? 'bg-green-50' : ''}`}>
                            <div className="flex items-center gap-2 min-w-0">
                              <span className="w-1 h-4 flex-shrink-0" style={{ backgroundColor: t.color }}></span>
                              <span className={`truncate ${arrived ? 'text-green-700 font-semibold' : 'text-gray-700'}`}>{arrived && '✓ '}{t.trip.t}</span>
                            </div>
                            <span className={`tabular-nums ml-2 ${arrived ? 'text-green-600' : 'text-gray-500'}`}>{formatTime(t.trip.m)}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // TeamJourneyMap: animated map showing one team fanning out to every race they've attended.
    // Inverted convergence: one origin (team home), many destinations (venues).
    function TeamJourneyMap({ teamName, teamHome, routesData }) {
      const [speed, setSpeed] = useState(1);
      const [clock, setClock] = useState('0/0');
      const [playing, setPlaying] = useState(false);
      const [finished, setFinished] = useState(false);
      const [arrivedVenues, setArrivedVenues] = useState(() => new Set());

      const mapContainerRef = React.useRef(null);
      const mapRef = React.useRef(null);
      const animRef = React.useRef({ trips: [], venueMarkers: [], homeMarker: null, startTs: null, pausedElapsed: 0, raf: null, longestMin: 0 });
      const speedRef = React.useRef(speed);
      const autoPlayPendingRef = React.useRef(false);
      const playingRef = React.useRef(false);
      const finishedRef = React.useRef(false);
      React.useEffect(() => { speedRef.current = speed; }, [speed]);
      React.useEffect(() => { playingRef.current = playing; }, [playing]);
      React.useEffect(() => { finishedRef.current = finished; }, [finished]);

      const ANIM_BASE_SECONDS = 10;
      const animDurationMs = () => (ANIM_BASE_SECONDS / speedRef.current) * 1000;

      // Build trips for this team from routesData
      const teamTrips = React.useMemo(() => {
        if (!routesData || !teamName) return null;
        const trips = [];
        for (const race of routesData.races) {
          const myTrip = race.trips.find(t => t.t === teamName);
          if (myTrip) {
            trips.push({
              raceDate: race.date,
              venue: race.venue,
              city: race.city,
              venueLoc: race.vl,
              route: myTrip.p,
              minutes: myTrip.m,
              miles: myTrip.d,
              riders: myTrip.r,
            });
          }
        }
        return trips;
      }, [routesData, teamName]);

      // Init map
      React.useEffect(() => {
        if (!mapContainerRef.current || mapRef.current) return;
        const m = L.map(mapContainerRef.current, { preferCanvas: true, zoomControl: true }).setView([47.5, -120.5], 7);
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png${cartoKey}`, {
          attribution: '© OpenStreetMap contributors, © CARTO', subdomains: 'abcd', maxZoom: 19,
        }).addTo(m);
        L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png${cartoKey}`, {
          subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
        }).addTo(m);
        mapRef.current = m;
        setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 100);
        return () => {
          if (animRef.current.raf) cancelAnimationFrame(animRef.current.raf);
          if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
        };
      }, []);

      // Load team's journey when team changes
      const loadJourney = React.useCallback(() => {
        if (!teamTrips || !teamHome || !mapRef.current) return;
        const map = mapRef.current;

        if (animRef.current.raf) cancelAnimationFrame(animRef.current.raf);
        animRef.current.raf = null;
        animRef.current.startTs = null;
        animRef.current.pausedElapsed = 0;

        for (const t of animRef.current.trips) {
          if (t.trailLayer) map.removeLayer(t.trailLayer);
          if (t.dotLayer) map.removeLayer(t.dotLayer);
        }
        for (const m of animRef.current.venueMarkers) map.removeLayer(m);
        if (animRef.current.homeMarker) map.removeLayer(animRef.current.homeMarker);

        if (teamTrips.length === 0) {
          animRef.current.trips = [];
          animRef.current.venueMarkers = [];
          animRef.current.homeMarker = null;
          setClock('0/0');
          setArrivedVenues(new Set());
          setFinished(false);
          return;
        }

        const longestMin = Math.max(...teamTrips.map(t => t.minutes));

        const trips = teamTrips.map((trip, i) => {
          const route = precomputeRoute(trip.route);
          const color = RACE_DAY_PALETTE[i % RACE_DAY_PALETTE.length];
          const trailLayer = L.polyline([], { color, weight: 3, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(map);
          const dotLayer = L.circleMarker([teamHome.lat, teamHome.lng], { radius: 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).addTo(map);
          dotLayer.bindTooltip(`${trip.raceDate} → ${trip.venue}`, { direction: 'top', offset: [0, -8] });
          return { trip, route, color, trailLayer, dotLayer, arrived: false, key: trip.raceDate + '|' + trip.venue };
        });

        const venueMarkers = teamTrips.map(trip =>
          L.circleMarker(trip.venueLoc, { radius: 4, color: '#f85149', weight: 1.5, fillColor: '#f85149', fillOpacity: 0.8 })
            .bindTooltip(`${trip.venue} (${trip.city}) — ${trip.raceDate}`, { direction: 'top', offset: [0, -6] })
            .addTo(map)
        );

        const homeMarker = L.marker([teamHome.lat, teamHome.lng], {
          icon: L.divIcon({
            className: 'race-day-venue-icon',
            html: `<div style="background:#2f81f7;color:white;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.5);white-space:nowrap;">🏠 ${teamName}</div>`,
            iconAnchor: [40, 12],
          })
        }).addTo(map);

        const allPoints = teamTrips.flatMap(t => t.route).concat([[teamHome.lat, teamHome.lng]]);
        map.fitBounds(L.latLngBounds(allPoints), { padding: [40, 40] });

        animRef.current = { ...animRef.current, trips, venueMarkers, homeMarker, longestMin };

        setClock(`0/${teamTrips.length}`);
        setArrivedVenues(new Set());
        setPlaying(false);
        setFinished(false);
        autoPlayPendingRef.current = true;
      }, [teamTrips, teamHome, teamName]);

      React.useEffect(() => { loadJourney(); }, [loadJourney]);

      const step = React.useCallback((timestamp) => {
        const state = animRef.current;
        if (state.startTs === null) state.startTs = timestamp - state.pausedElapsed;
        const elapsed = timestamp - state.startTs;
        const dur = animDurationMs();
        const progress = Math.min(1, elapsed / dur);

        const newlyArrived = new Set();
        let arrivedCount = 0;
        for (const t of state.trips) {
          const frac = Math.min(1, progress * (state.longestMin / t.trip.minutes));
          const pt = pointAt(t.route, frac);
          const target = frac * t.route.total;
          const trail = [];
          for (let i = 0; i < t.route.points.length; i++) {
            if (t.route.cum[i] <= target) trail.push(t.route.points[i]);
            else break;
          }
          trail.push(pt);
          t.trailLayer.setLatLngs(trail);
          t.dotLayer.setLatLng(pt);
          if (frac >= 1) {
            arrivedCount++;
            if (!t.arrived) {
              t.arrived = true;
              newlyArrived.add(t.key);
            }
          }
        }

        if (newlyArrived.size > 0) {
          setArrivedVenues(prev => {
            const next = new Set(prev);
            newlyArrived.forEach(k => next.add(k));
            return next;
          });
        }

        setClock(`${arrivedCount}/${state.trips.length}`);

        if (progress >= 1) {
          state.raf = null;
          state.startTs = null;
          state.pausedElapsed = 0;
          setPlaying(false);
          setFinished(true);
          return;
        }
        state.raf = requestAnimationFrame(step);
      }, []);

      const handlePlay = () => {
        if (!teamTrips || teamTrips.length === 0) return;
        if (playing) {
          const state = animRef.current;
          if (state.raf) cancelAnimationFrame(state.raf);
          state.raf = null;
          const now = performance.now();
          if (state.startTs !== null) state.pausedElapsed = now - state.startTs;
          state.startTs = null;
          setPlaying(false);
        } else {
          if (finished) { handleReplay(); return; }
          setPlaying(true);
          animRef.current.startTs = null;
          animRef.current.raf = requestAnimationFrame(step);
        }
      };

      const handleReplay = () => {
        if (!teamTrips || teamTrips.length === 0) return;
        const state = animRef.current;
        if (state.raf) cancelAnimationFrame(state.raf);
        state.raf = null;
        state.startTs = null;
        state.pausedElapsed = 0;
        for (const t of state.trips) {
          t.trailLayer.setLatLngs([]);
          t.dotLayer.setLatLng([teamHome.lat, teamHome.lng]);
          t.arrived = false;
        }
        setClock(`0/${state.trips.length}`);
        setArrivedVenues(new Set());
        setFinished(false);
        setPlaying(true);
        state.raf = requestAnimationFrame(step);
      };

      // IntersectionObserver: autoplay when the map scrolls into view after a new team is loaded.
      React.useEffect(() => {
        if (!mapContainerRef.current) return;
        const el = mapContainerRef.current;
        const maybeStart = () => {
          if (!autoPlayPendingRef.current) return;
          if (playingRef.current || finishedRef.current) return;
          if (animRef.current.trips.length === 0) return;
          autoPlayPendingRef.current = false;
          setPlaying(true);
          animRef.current.startTs = null;
          animRef.current.raf = requestAnimationFrame(step);
        };
        const observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) maybeStart(); });
        }, { threshold: 0.3 });
        observer.observe(el);
        const t1 = setTimeout(maybeStart, 300);
        const t2 = setTimeout(maybeStart, 900);
        return () => { observer.disconnect(); clearTimeout(t1); clearTimeout(t2); };
      }, [step]);

      if (!routesData) {
        return (
          <div className="bg-white rounded-lg shadow-lg p-6">
            <h2 className="text-xl font-bold text-gray-800 mb-2">🗺️ Travel Journey</h2>
            <p className="text-gray-500">Loading route data…</p>
          </div>
        );
      }

      const sortedTrips = teamTrips ? [...teamTrips].sort((a, b) => a.minutes - b.minutes) : [];
      // One row per venue; races at the same venue share a drive time.
      const venueRows = [];
      sortedTrips.forEach(t => {
        const row = venueRows.find(v => v.venue === t.venue && v.city === t.city);
        if (row) row.trips.push(t);
        else venueRows.push({ venue: t.venue, city: t.city, minutes: t.minutes, trips: [t] });
      });

      return (
        <div className="bg-white rounded-lg shadow-lg p-4 md:p-6">
          <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-3 mb-4">
            <div>
              <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1">🗺️ Travel Journey — {teamName}</h2>
              <p className="text-sm text-gray-500">Every race this team has driven to, fanning out from home at real-drive-time proportions.</p>
            </div>
          </div>

          {teamTrips && teamTrips.length === 0 ? (
            <p className="text-gray-500">No route data available for this team yet.</p>
          ) : (
            <>
              <div className="flex flex-wrap gap-3 items-center mb-4">
                <div className="flex items-center gap-2">
                  <button
                    onClick={handlePlay}
                    disabled={!teamTrips}
                    className={`px-4 py-1.5 rounded font-semibold text-sm text-white ${playing ? 'bg-amber-600 hover:bg-amber-700' : 'bg-green-600 hover:bg-green-700'} disabled:bg-gray-300`}
                  >
                    {playing ? '❚❚ Pause' : (finished ? '↻ Play Again' : '▶ Play')}
                  </button>
                  <button
                    onClick={handleReplay}
                    disabled={!teamTrips}
                    className="px-3 py-1.5 rounded font-semibold text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50"
                  >
                    ↻ Replay
                  </button>
                </div>
                <div className="flex items-center gap-2">
                  <label className="text-xs uppercase tracking-wide text-gray-500 font-semibold">Speed</label>
                  <input type="range" min="0.5" max="5" step="0.5" value={speed} onChange={e => setSpeed(parseFloat(e.target.value))} className="w-24" />
                  <span className="text-sm text-gray-700 tabular-nums min-w-[24px]">{speed}×</span>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-4">
                <div className="relative">
                  <div ref={mapContainerRef} style={{ width: '100%', height: '520px', borderRadius: '8px', overflow: 'hidden' }} />
                </div>

                <div className="space-y-3">
                  <div className="bg-gray-900 text-white rounded-lg p-4 text-center">
                    <div className="text-4xl font-bold tabular-nums">{clock}</div>
                    <div className="text-xs text-gray-400 uppercase tracking-wide mt-1">Arrivals / Total</div>
                  </div>

                  {teamTrips && (
                    <div>
                      <div className="text-xs text-gray-500 uppercase tracking-wide font-semibold mb-2">Venues (closest first)</div>
                      <div className="max-h-[400px] overflow-y-auto border border-gray-200 rounded">
                        {venueRows.map(v => {
                          const first = v.trips[0];
                          const key = v.city + '|' + v.venue;
                          const arrived = v.trips.some(t => arrivedVenues.has(t.raceDate + '|' + t.venue));
                          // Find the original color by matching position in teamTrips
                          const origIdx = teamTrips.findIndex(x => x.raceDate === first.raceDate && x.venue === first.venue);
                          const color = RACE_DAY_PALETTE[origIdx % RACE_DAY_PALETTE.length];
                          return (
                            <div key={key} className={`flex items-center justify-between px-2 py-1.5 text-xs border-b border-gray-100 ${arrived ? 'bg-green-50' : ''}`}>
                              <div className="flex items-center gap-2 min-w-0">
                                <span className="w-1 h-4 flex-shrink-0" style={{ backgroundColor: color }}></span>
                                <span className={`truncate ${arrived ? 'text-green-700 font-semibold' : 'text-gray-700'}`}>{arrived && '✓ '}{v.venue}</span>
                                {v.trips.length > 1 && <span className="text-gray-400 flex-shrink-0">×{v.trips.length}</span>}
                              </div>
                              <span className={`tabular-nums ml-2 ${arrived ? 'text-green-600' : 'text-gray-500'}`}>{formatTime(v.minutes)}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // RaceDayView: full-featured Race Day tab (all races, big map, sidebar)
    function RaceDayView({ routesData }) {
      const races = routesData ? routesData.races : null;
      return (
        <ConvergenceAnimation
          races={races}
          title="🏁 Race Day"
          description="Every team leaves home at the same moment. Watch them converge on the venue at real-drive-time proportions."
          height="600px"
          compact={false}
          showSidebar={true}
        />
      );
    }

    ReactDOM.render(<WSCLDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
